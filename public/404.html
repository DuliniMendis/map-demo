<!doctype html>
<html lang="en-AU">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Page not found · Country Map</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #ffffff;
        --fg: #1b1f24;
        --muted: #5b6470;
        --link: #8a3b12;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #12161b;
          --fg: #e6e9ed;
          --muted: #9aa4b0;
          --link: #f0a46c;
        }
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--bg);
        color: var(--fg);
        font-family:
          system-ui,
          -apple-system,
          'Segoe UI',
          Roboto,
          'Helvetica Neue',
          Arial,
          sans-serif;
        line-height: 1.5;
      }
      main {
        max-width: 36rem;
        margin: 0 auto;
        padding: 15vh 1.5rem 2rem;
      }
      h1 {
        font-size: 1.5rem;
        margin: 0 0 0.5rem;
      }
      p {
        color: var(--muted);
      }
      a {
        color: var(--link);
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Page not found</h1>
      <p>
        There is nothing at this address. Country Map lives on a single page; a shared link to a
        nation looks like <code>/?n=L3</code>.
      </p>
      <p><a href="/">Back to the map</a></p>
    </main>
  </body>
</html>
