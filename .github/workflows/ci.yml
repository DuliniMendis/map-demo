name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      update_snapshots:
        description: 'Regenerate Linux visual baselines (download the "visual-baselines" artifact and commit it)'
        type: boolean
        default: false

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4 # version from package.json "packageManager"
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm test

  # Playwright against the production build served by `vite preview`. Every third-party tile request is
  # answered from tests/fixtures/tiles/ (no live tile hosts are hit). WebGL runs on SwiftShader (no GPU),
  # which takes 20+ minutes, so this job runs only on demand: Actions -> CI -> Run workflow.
  e2e:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - name: Install Chromium
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps --only-shell chromium
      - name: Install Chromium system dependencies
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium
      - run: pnpm build:e2e
      - name: Playwright
        # Screenshot tests (visual.spec.ts) only run when regenerating baselines.
        env:
          VISUAL: ${{ inputs.update_snapshots && '1' || '' }}
        run: pnpm exec playwright test ${{ inputs.update_snapshots && '--update-snapshots' || '' }}
      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            node_modules/.cache/playwright/report
            node_modules/.cache/playwright/test-results
          include-hidden-files: true
          retention-days: 14
      - name: Upload visual baselines
        if: ${{ inputs.update_snapshots }}
        uses: actions/upload-artifact@v7
        with:
          name: visual-baselines
          path: tests/playwright/__screenshots__
          retention-days: 7

  # Bundle budgets (docs/qa.md "Budgets"): app JS excluding MapLibre, MapLibre main + worker, CSS, total.
  size:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm size

  # Lighthouse CI on the built site, served locally by lhci (tile hosts blocked, see lighthouserc.json).
  # Accessibility >= 95 is enforced; performance >= 80 is advisory (warn) because WebGL on the runner is
  # software-rendered and the score is noisy. Reports are uploaded as an artifact.
  lighthouse:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Lighthouse CI
        run: pnpm exec lhci autorun
      - name: Upload Lighthouse reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: lighthouse-report
          path: node_modules/.cache/lhci
          include-hidden-files: true
          retention-days: 14
